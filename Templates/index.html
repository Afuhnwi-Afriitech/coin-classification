<!DOCTYPE html>
<html>
<head>
<title>Coin Classifier</title>
</head>

<body>

<h2>Upload Coin Image</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">Predict</button>
</form>

{% if coin %}
<h3>Coin: {{ coin }}</h3>
<h4>Confidence: {{ confidence }}%</h4>
{% endif %}

</body>
</html>
